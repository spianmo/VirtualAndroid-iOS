name: VirtualAndroid
options:
  bundleIdPrefix: dev.virtualandroid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
targets:
  VirtualAndroid:
    type: application
    platform: iOS
    sources:
      - path: VirtualAndroid
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.virtualandroid.app
        PRODUCT_NAME: VirtualAndroid
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: VirtualAndroid/Support/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: VirtualAndroid/Support/VirtualAndroid-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../host/include"
          - "$(SRCROOT)/../gfx/include"
          - "$(SRCROOT)/VirtualAndroid/Support"
        CODE_SIGN_STYLE: Automatic
        # Set DEVELOPMENT_TEAM (paid team) for device builds; the kernel memory
        # entitlements below cannot be provisioned with a free team.
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
        # VA_STUB_ONLY=1 compiles the QEMU engine out entirely.
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) VA_APP=1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: VirtualAndroid/Support/VirtualAndroid-Debug.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
        Release:
          CODE_SIGN_ENTITLEMENTS: VirtualAndroid/Support/VirtualAndroid.entitlements
    postCompileScripts:
      - name: Embed engine frameworks (if built)
        script: "\"${SRCROOT}/scripts/embed_engine_frameworks.sh\""
        basedOnDependencyAnalysis: false
    scheme:
      testTargets: [VirtualAndroidUITests]
      gatherCoverageData: false
  VirtualAndroidUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: VirtualAndroid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.virtualandroid.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
